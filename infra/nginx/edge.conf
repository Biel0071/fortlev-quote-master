# Edge reverse proxy on the VPS host.
# Terminates SSL, preserves Host header (critical for multi-tenant resolution),
# and forwards to blue/green app containers.
#
# Copy to /etc/nginx/conf.d/edge.conf on the VPS.
# Requires certificates in /etc/letsencrypt/live/<domain>/ (certbot).

# Upstream = blue OR green (swapped by deploy script)
upstream app_upstream {
    # Deploy script rewrites this line to point to app_blue:80 or app_green:80.
    server 127.0.0.1:8081;   # blue  (default)
    # server 127.0.0.1:8082; # green (standby)
    keepalive 32;
}

# HTTP -> HTTPS (all domains)
server {
    listen 80;
    listen [::]:80;
    server_name mfatacadista.com www.mfatacadista.com
                materialdecontrucao.online www.materialdecontrucao.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - one server block handles ALL tenant domains.
# Host header is preserved so the React app resolves store via store_domains.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mfatacadista.com www.mfatacadista.com
                materialdecontrucao.online www.materialdecontrucao.online;

    # Use SNI to pick the right cert (certbot manages one cert per domain
    # OR a multi-SAN cert - either works).
    ssl_certificate     /etc/letsencrypt/live/materialdecontrucao.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/materialdecontrucao.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25M;

    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;

        # CRITICAL: preserve original Host so the app knows which tenant to serve
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
