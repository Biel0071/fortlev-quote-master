<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradiente do corpo da caixa Fortlev -->
    <linearGradient id="fortlevBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a3a78"/>
      <stop offset="20%" stop-color="#1565c0"/>
      <stop offset="55%" stop-color="#1e88e5"/>
      <stop offset="85%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0a326a"/>
    </linearGradient>

    <!-- Gradiente da tampa -->
    <linearGradient id="fortlevLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="40%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>

    <!-- Gradiente dos anéis de reforço estrutural -->
    <linearGradient id="ribHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90caf9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d47a1" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Sombra suave no piso -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sombra no solo -->
  <ellipse cx="250" cy="442" rx="195" ry="24" fill="url(#groundShadow)"/>

  <!-- Corpo Cônico da Caixa d'Água Fortlev -->
  <path d="M72 170 L108 415 Q250 445 392 415 L428 170 Z" fill="url(#fortlevBody)"/>

  <!-- Frisos e anéis de reforço característicos Fortlev -->
  <!-- Friso inferior -->
  <path d="M102 380 Q250 408 398 380" fill="none" stroke="url(#ribHighlight)" stroke-width="7" stroke-linecap="round"/>
  <path d="M102 383 Q250 411 398 383" fill="none" stroke="#08254f" stroke-width="3" stroke-linecap="round"/>

  <!-- Friso médio -->
  <path d="M89 312 Q250 344 411 312" fill="none" stroke="url(#ribHighlight)" stroke-width="8" stroke-linecap="round"/>
  <path d="M89 315 Q250 347 411 315" fill="none" stroke="#08254f" stroke-width="3" stroke-linecap="round"/>

  <!-- Friso superior -->
  <path d="M78 245 Q250 280 422 245" fill="none" stroke="url(#ribHighlight)" stroke-width="8" stroke-linecap="round"/>
  <path d="M78 248 Q250 283 422 248" fill="none" stroke="#08254f" stroke-width="3" stroke-linecap="round"/>

  <!-- Selo / Logotipo Branco 'FORTLEV' impresso no relevo frontal -->
  <g transform="translate(250 285)">
    <rect x="-82" y="-17" width="164" height="34" rx="7" fill="#ffffff" opacity="0.96" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.25))"/>
    <text x="0" y="7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="21" fill="#0b4594" letter-spacing="2.5">FORTLEV</text>
  </g>

  <!-- Borda da Boca da Caixa -->
  <ellipse cx="250" cy="170" rx="178" ry="28" fill="#09326a"/>
  <ellipse cx="250" cy="167" rx="176" ry="26" fill="#1565c0"/>

  <!-- Tampa com pega central e travas 1/4 de volta -->
  <path d="M68 165 Q250 128 432 165 Q250 198 68 165 Z" fill="url(#fortlevLid)"/>
  <ellipse cx="250" cy="158" rx="168" ry="23" fill="#1e88e5"/>

  <!-- Topo da tampa com ressalto e pegador -->
  <ellipse cx="250" cy="151" rx="96" ry="13" fill="#42a5f5"/>
  <path d="M212 149 Q250 138 288 149 Q250 156 212 149 Z" fill="#0d47a1"/>
  <rect x="233" y="138" width="34" height="11" rx="4.5" fill="#ffffff" opacity="0.9"/>

  <!-- Reflexo de luz tridimensional -->
  <path d="M96 178 L122 410 Q152 418 158 415 L132 178 Z" fill="#ffffff" opacity="0.14"/>
</svg>